# cargo-mutants configuration (TL-231). Run with `make mutants` or
# `make mutants-diff`; see docs/verification-tooling.md for budgets.
# The crate has no CI-plumbing module, so nothing is excluded.

# `serde` pulls in the wire-reader sources; mutate them with the tests that
# exercise them.
additional_cargo_args = ["--all-features"]

# The floor is high so that a slow test run on a loaded machine is not reported as a hang;
# a timeout counts as unkilled either way (SR-231 records the measurement).
minimum_test_timeout = 300
timeout_multiplier = 3.0

# tests/feature_boundary.rs rebuilds the crate for every feature set and takes minutes; it checks
# feature gating, which no mutant changes, so mutation runs skip it.
additional_cargo_test_args = ["--", "--skip", "no_std_feature_matrix_and_default_dependency_gate_execute"]

# Equivalent mutants (one-line reason each).
exclude_re = [
    # `minimum` returns the same value for `<` and `<=`: equal operands give equal results.
    'limits\.rs:\d+:\d+: replace < with <= in minimum',
    # Equivalent: adjacent equal propositions were already refused as duplicates, so `>=` never sees an equal pair.
    '^src/formula/trace\.rs:197:\d+: replace > with >= in PartialValuation::admit_without_map$',
    # Equivalent: adjacent equal roots were already refused as duplicates, so `>=` never sees an equal pair.
    '^src/formula/trace\.rs:737:\d+: replace > with >= in FairnessPremisesDocument::new_unchecked_graph$',
    # Unreachable: serde_json reports no size hint for an array, so the pre-check never runs; the length check inside the loop enforces the same limit.
    '^src/signal/proposition\.rs:103:\d+: replace > with (==|<|>=) in deserialize_propositions',
    '^src/signal/document\.rs:308:\d+: replace > with (==|<|>=) in deserialize_bounded_vec',
    # Test-support code: `error_variants.rs` is compiled only under cfg(test) and holds the helper that checks the variant tests; it is not production behavior.
    '^src/error_variants\.rs:\d+:\d+: replace Seen::complete with \(\)$',
]
