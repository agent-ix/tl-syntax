# cargo-mutants configuration (TL-231). Run with `make mutants` or
# `make mutants-diff`; see docs/verification-tooling.md for budgets.
# The crate has no CI-plumbing module, so nothing is excluded.

# `serde` pulls in the wire-reader sources; mutate them with the tests that
# exercise them.
additional_cargo_args = ["--all-features"]

minimum_test_timeout = 60
timeout_multiplier = 3.0
