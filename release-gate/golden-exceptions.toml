# Declared differences between retained golden files and the previous release
# tag (FR-031-AC-2). A changed or deleted golden passes the release gate only if
# it is listed here for its repo and the tag it is measured against. An
# undeclared difference fails, and an entry whose file no longer differs fails
# as stale. Entries measured against an older tag are ignored. Each entry was
# checked against the real diff; the reason says what changed.

