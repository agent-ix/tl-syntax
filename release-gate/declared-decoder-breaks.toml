# Declared breaks of a candidate decoder against bytes the previous release
# wrote. The legacy decoder replay expects the candidate to REFUSE the named
# replay fixture as it is and fails if it accepts the bytes, so an entry goes
# stale the moment the break is undone. The replay then strips the removed
# fields from the raw old bytes (keeping the key order, so exact-encoding
# decoders still see canonical bytes) and requires the rest to decode and pass
# the fixture's content checks, so the refusal is proven to come from exactly
# that removal. Each entry also requires a line in the candidate CHANGELOG
# release section naming the schema identity in backticks with a `Migration:`
# note. Entries measured against an older tag are ignored.
#
# `removed_fields` are the wire names of the top-level keys the candidate
# dropped, without `:`, `,`, `+`, quotes or backslashes. The identity must be the
# one the fixture carries: `parse` is `tl-parse.diagnostics/v1`, `rewrite` is
# `tl-rewrite.report/v1` and `conformance` is `tl-rewrite.conformance/v1`. Only
# those fixtures are replayed (`replay.json` is replayed as required-accepted);
# other identities affected by the same change are covered by the CHANGELOG
# review, not by this replay.

[[decoder_break]]
repo = "tl-parse"
fixture = "parse"
removed_fields = ["tl_syntax_revision"]
identity = "tl-parse.diagnostics/v1"
measured_against = "v0.3.0"
reason = "tl-parse 0.4.0 removed the tl_syntax_revision field from ParseReport; the report types reject unknown fields, so v0.3.0 parser report bytes are refused. The schema identity is unchanged by decision for the pre-release 0.x line. Regenerate old reports."

[[decoder_break]]
repo = "tl-rewrite"
fixture = "rewrite"
removed_fields = ["syntaxRevision"]
identity = "tl-rewrite.report/v1"
measured_against = "v0.3.0"
reason = "tl-rewrite 0.4.0 removed the syntaxRevision field from RewriteReport; the record decoder rejects unknown fields, so v0.3.0 rewrite report bytes are refused. The schema identity is unchanged by decision for the pre-release 0.x line. Regenerate old reports."

[[decoder_break]]
repo = "tl-rewrite"
fixture = "conformance"
removed_fields = ["evaluatorRevision", "syntaxRevision"]
identity = "tl-rewrite.conformance/v1"
measured_against = "v0.3.0"
reason = "tl-rewrite 0.4.0 removed the evaluatorRevision and syntaxRevision fields from ConformanceReport; the report rejects unknown fields, so v0.3.0 conformance report bytes are refused. The schema identity is unchanged by decision for the pre-release 0.x line. Regenerate old reports."
