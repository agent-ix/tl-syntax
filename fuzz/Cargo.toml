[package]
name = "tl-syntax-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"

[dependencies.tl-syntax]
path = ".."
features = ["serde"]

[[bin]]
name = "wire_decode"
path = "fuzz_targets/wire_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "infinite_wire_decode"
path = "fuzz_targets/infinite_wire_decode.rs"
test = false
doc = false
bench = false
