[package]
name = "tl-syntax"
version = "0.4.0"
edition = "2021"
rust-version = "1.98.1"
description = "A no_std syntax tree and semantic profile model for Mission-time Linear Temporal Logic."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT"
publish = false
repository = "https://github.com/agent-ix/tl-syntax"

[lib]
name = "tl_syntax"
path = "src/lib.rs"

[features]
default = []
alloc = []
serde = ["alloc", "dep:serde", "dep:serde_json", "dep:sha2"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }
serde_json = { version = "1.0", default-features = false, features = ["alloc"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
serde_json = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.release]
lto = "thin"
codegen-units = 1
