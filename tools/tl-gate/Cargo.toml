[package]
name = "tl-gate"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Mutation-gate and cargo-mutants runner shared by the tl-* crates."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT"
publish = false
repository = "https://github.com/agent-ix/tl-syntax"

[lib]
name = "tl_gate"
path = "src/lib.rs"

[[bin]]
name = "tl-gate"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tempfile = "=3.10.1"

[lints.rust]
unsafe_code = "forbid"

[workspace]
